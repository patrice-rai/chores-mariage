# Essai du paquet (scripts/essai-paquet.mjs) : arborescence de Hostinger imitée, HTTPS (certificat auto-signé de
# l'essai), racine web public_html/ ; le site vit dans public_html/chores/, son code dans chores-app/, hors racine.
ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:443>
    ServerName 127.0.0.1
    DocumentRoot /home/u000000000/domains/exemple.test/public_html
    SSLEngine on
    SSLCertificateFile /etc/ssl/essai/cert.pem
    SSLCertificateKeyFile /etc/ssl/essai/cle.pem

    <Directory /home/u000000000/domains/exemple.test/public_html>
        Options -Indexes -MultiViews +SymLinksIfOwnerMatch
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    SetEnvIf Request_URI "/(e|admin/cle)/" url_secrete
    CustomLog /proc/self/fd/1 combined env=!url_secrete
    CustomLog /proc/self/fd/1 "%h %l %u %t \"%m [adresse secrète]\" %>s %b" env=url_secrete
</VirtualHost>
