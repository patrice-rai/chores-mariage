# Hôte virtuel de développement : la racine web est public/, comme le dossier du site dans public_html chez
# Hostinger ; app/, scripts/, stockage/ et config.php restent hors racine web, comme en production.
ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/app/public

    <Directory /var/www/app/public>
        Options -Indexes -MultiViews +SymLinksIfOwnerMatch
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    # Le lien secret et la clé d'administration ne vont jamais dans le journal d'accès.
    SetEnvIf Request_URI "/(e|admin/cle)/" url_secrete
    CustomLog /proc/self/fd/1 combined env=!url_secrete
    CustomLog /proc/self/fd/1 "%h %l %u %t \"%m [adresse secrète]\" %>s %b" env=url_secrete
</VirtualHost>
